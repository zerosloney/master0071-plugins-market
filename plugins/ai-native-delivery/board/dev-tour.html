  }

  function buildTree(files) {
    const root = { name: '', path: '', dirs: new Map(), files: [] };
    for (const f of files) {
      const parts = f.path.split('/');
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const name = parts[i];
        if (!node.dirs.has(name)) node.dirs.set(name, { name, path: parts.slice(0, i + 1).join('/'), dirs: new Map(), files: [] });
        node = node.dirs.get(name);
      }
      node.files.push(f);
    }
    return root;
  }

  function statusDot(f) {
    if (f.status === 'new') return 'var(--ok)';
    if (f.status === 'modified') return 'var(--accent)';
    if (f.status === 'deleted') return 'var(--bad)';
    if (f.status === 'renamed') return 'var(--muted)';
    return 'var(--warn)';
  }
  function badgeOf(f) {
    let b = '';
    if (f.test) b += `<span class="badge test">测试</span>`;
    else if (f.badge) b += `<span class="badge ${esc(f.status)}">${esc(f.badge)}</span>`;
    if (f.pathGuess) b += `<span class="badge planned" title="路径按同名多候选推断，建议在文档中写全路径">猜?</span>`;
    return b;
  }

  function renderTree() {
    const q = state.query.trim().toLowerCase();
    const dfo = dataflowObj();
    let files = DATA.files.filter((f) => !q || f.path.toLowerCase().includes(q) || (stepOf(state.step)?.title || '').toLowerCase().includes(q));
    if (dfo) {
      const set = new Set(dfo.files || []);
      files = files.filter((f) => set.has(f.path));
    } else if (state.step) {
      const set = new Set(stepOf(state.step)?.files || []);
      files = files.filter((f) => set.has(f.path));
    }
    $('#file-count').textContent = files.length + ' / ' + DATA.files.length;
    const tree = buildTree(files);
    const dirs = [...tree.dirs.values()].sort((a, b) => a.name.localeCompare(b.name));
    const rootFiles = tree.files.slice().sort((a, b) => a.path.localeCompare(b.path));
    const html = [];
    for (const d of dirs) html.push(renderDir(d, 0));
    for (const f of rootFiles) html.push(renderFile(f, 0));
    $('#file-tree').innerHTML = html.join('') || '<div class="none">无文件</div>';
  }

  function renderDir(node, depth) {
    const collapsed = state.collapsed.has(node.path);
    const dirs = [...node.dirs.values()].sort((a, b) => a.name.localeCompare(b.name));
    const files = node.files.slice().sort((a, b) => a.path.localeCompare(b.path));
    const n = countFiles(node);
    return `<div class="tree-dir ${collapsed ? 'closed' : ''}" data-dir="${esc(node.path)}">` +
      `<div class="tree-row" style="padding-left:${4 + depth * 12}px" role="button" tabindex="0" aria-label="目录 ${esc(node.path)}"><span class="chev">▼</span><span class="folder">▸</span><span>${esc(node.name)}</span><span style="margin-left:auto;font:9px var(--mono);color:var(--faint)">${n}</span></div>` +
      `<div class="tree-children">` +
      dirs.map((d) => renderDir(d, depth + 1)).join('') +
      files.map((f) => renderFile(f, depth + 1)).join('') +
      `</div></div>`;
  }
  function countFiles(node) {
    let n = node.files.length;
    for (const d of node.dirs.values()) n += countFiles(d);
    return n;
  }
  function renderFile(f, depth) {
    return `<div class="tree-file ${state.file === f.path ? 'on' : ''}" data-file="${esc(f.path)}" style="padding-left:${20 + depth * 12}px" title="${esc(f.path)}" role="button" tabindex="0" aria-label="文件 ${esc(f.path)}">` +
      `<span class="dot" style="background:${statusDot(f)}"></span><span class="nm">${esc(f.path.split('/').pop())}</span>` +
      `${f.test ? '<span class="bd" style="color:var(--intent)">测</span>' : (f.badge ? `<span class="bd" style="color:${statusDot(f)}">${esc(f.badge)}</span>` : '')}` +
      `${f.pathGuess ? '<span class="bd" style="color:var(--warn)" title="路径按同名多候选推断，建议在文档中写全路径">猜?</span>' : ''}</div>`;
  }

  function renderCanvas() {
    const c = $('#canvas');
    const grid = state.view === 'panorama' && state.layout === 'grid';
    c.className = 'view-' + state.view + (grid ? ' layout-grid' : '');
    if (state.view === 'sequence') c.innerHTML = sequenceHtml();
    else if (state.view === 'flow') { c.innerHTML = flowHtml(); requestAnimationFrame(drawFlowDeps); }
    else if (state.view === 'reqs') c.innerHTML = reqsHtml();
    else if (state.view === 'verify') c.innerHTML = verifyHtml();
    else if (state.view === 'dataflow') c.innerHTML = dataflowHtml();
    else c.innerHTML = panoramaHtml();
    c.style.transform = state.zoom === 1 ? '' : `scale(${state.zoom})`;
    $('#zoom-label').textContent = Math.round(state.zoom * 100) + '%';
    const lt = $('#layout-toggle');
    if (lt) {
      lt.style.display = state.view === 'panorama' ? 'inline-block' : 'none';
      lt.textContent = '布局：' + (state.layout === 'grid' ? '网格' : '时间线');
    }
    const fb = $('#btn-focus');
    if (fb) {
      fb.style.display = state.view === 'panorama' ? 'inline-block' : 'none';
      fb.textContent = document.body.classList.contains('focus') ? '退出专注' : '专注全景';
    }
    const hint = $('#pan-hint');
    if (hint) {
      const sc = $('#canvas-scroll');
      requestAnimationFrame(() => {
        hint.style.display = (state.view === 'panorama' && state.layout === 'timeline' && state.zoom === 1 && c.scrollWidth > sc.clientWidth + 4) ? 'block' : 'none';
      });
    }
  }

  function panoramaHtml() {
    const list = stepsFor(state.filter);
    if (!list.length) return '<div class="none">当前筛选无步骤</div>';
    const related = relatedSteps();
    const hasDf = hasDataflow();
    const stations = list.map((s, i) => {
      const files = filesForStep(s.id);
      const shown = files.slice(0, 5);
      const objs = stepObjects(s.id);
      const objBadges = hasDf && objs.length
        ? `<div class="st-objs">` +
          objs.slice(0, 3).map((o) => `<span class="kbadge ${esc(o.kind || '')} ${state.dataflowObj === o.name ? 'on' : ''}" data-df="${esc(o.name)}" title="数据对象 ${esc(o.name)}（点击联动相关步骤与文件）">${esc(o.name)}</span>`).join('') +
          (objs.length > 3 ? `<span class="kbadge">+${objs.length - 3}</span>` : '') +
          `</div>`
        : '';
      const app = isAppendix(s);
      const hasAppendix = DATA.steps.some(isAppendix);
      const emptyLabel = isVerificationStep(s)
        ? '验证步骤 · 无代码文件'
        : `该步未列文件${hasAppendix ? ' · <span class="lnk" data-step="A">查看附录改动清单</span>' : ''}`;
      return `<div class="station ${state.step === s.id || (related && related.has(s.id)) ? 'on' : ''} ${s.status === 'warn' ? 'warn' : ''} ${app ? 'appendix' : ''}" data-step="${esc(s.id)}" style="--i:${i}" role="button" tabindex="0" aria-label="${esc(stepAria(s))}">` +
        `<div class="st-top"><span class="st-no">${stepNo(s)}</span><div class="st-headtext"><span class="st-label">${app ? '附录 · 改动清单' : stepName(s)}</span><span class="st-title" title="${esc(s.title)}">${esc(stepTitle(s))}</span></div></div>` +
        `<div class="st-card">` +
        (s.summary ? `<div class="st-summary" title="${esc(s.summary)}">${s.source === 'tasks' ? '<span class="st-k">判据</span>' : ''}${esc(s.summary)}</div>` : '') +
        `<div class="st-files">` +
        (shown.length ? shown.map((f) => {
          const base = f.path.split('/').pop();
          const dir = f.path.split('/').slice(-2, -1)[0] || '';
          return `<div class="st-file" data-file="${esc(f.path)}" title="${esc(f.path)}"><span class="dot" style="background:${statusDot(f)}"></span><span class="nm"><span class="bn">${esc(base)}</span>${dir ? `<span class="dir">${esc(dir)}</span>` : ''}</span><span style="margin-left:auto;color:${statusDot(f)};font-size:10px">${esc(f.badge || '')}</span></div>`;
        }).join('') : `<div class="st-empty">${emptyLabel}</div>`) +
        (files.length > shown.length ? `<div class="st-more" title="在右侧查看全部 ${files.length} 个文件">查看全部 ${files.length} 个文件 →</div>` : '') +
        `</div>` + objBadges + `</div></div>`;
    }).join('');
    return state.layout === 'grid' ? `<div class="station-grid">${stations}</div>` : stations;
  }

  function sequenceHtml() {
    const seq = DATA.sequence;
    if (!seq || !seq.participants.length || !seq.messages.length) return '<div class="seq-empty">暂无可推导的时序（步骤未关联到架构层文件）</div>';
    const parts = seq.participants;
    const idx = new Map(parts.map((p, i) => [p.id, i]));
    const n = parts.length;
    const width = 1000;
    const head = parts.map((p) => `<div class="seq-part" data-layer="${esc(p.id)}" title="架构层：${esc(LAYER_LABEL[p.id] || p.id)}"><span class="box">${esc(p.label)}</span></div>`).join('');
    const lines = parts.map(() => '<i></i>').join('');
    const msgs = seq.messages.map((m) => {
      const a = idx.get(m.from);
      const b = idx.get(m.to);
      if (a == null || b == null) return '';
      const x1 = (a + 0.5) / n * width;
      const x2 = (b + 0.5) / n * width;
      const st = stepOf(m.stepId);
      const color = m.dashed ? '#7d6224' : '#bc4327';
      let svg = '';
      if (a === b) {
        const x = x1;
        svg = `<path d="M ${x - 7} 30 L ${x - 7} 19 L ${x + 7} 19 L ${x + 7} 27" fill="none" stroke="${color}" stroke-width="1" ${m.dashed ? 'stroke-dasharray="4 3"' : ''}/><polygon points="${x + 3},27 ${x + 11},27 ${x + 7},33" fill="${color}"/>`;
      } else {
        const dir = x2 > x1 ? 1 : -1;
        svg = `<line x1="${x1}" y1="31" x2="${x2 - dir * 6}" y2="31" stroke="${color}" stroke-width="1" ${m.dashed ? 'stroke-dasharray="4 3"' : ''}/>` +
          `<polygon points="${x2 - dir * 12},27 ${x2 - dir * 4},31 ${x2 - dir * 12},35" fill="${color}"/>`;
      }
      const mx = a === b ? x1 : (x1 + x2) / 2;
      return `<div class="seq-msg ${state.step === m.stepId ? 'on' : ''} ${isAppendix(st) ? 'appendix' : ''}" data-step="${esc(m.stepId)}" title="${esc(st ? stepTitle(st) : m.stepId)}">` +
        `<svg viewBox="0 0 ${width} 50" preserveAspectRatio="none">${svg}</svg>` +
        `<span class="lbl" style="left:${(mx / width * 100).toFixed(2)}%"><b>${esc(isAppendix(st) ? '附' : m.stepId)}</b>${esc(m.label)}</span></div>`;
    }).join('');
    return `<div class="seq-wrap" style="--n:${n}">` +
      `<div class="seq-titlebar"><b>调用时序</b><span>${parts.length} 个参与层 · ${seq.messages.length} 条步骤消息 · 点击消息联动</span></div>` +
      `<div class="seq-head">${head}</div>` +
      `<div class="seq-body"><div class="seq-lifelines">${lines}</div>${msgs}</div></div>`;
  }

  // —— 依赖旁路弧：模型 deps.edges（声明依赖，已传递归约），主链相邻边不重复画 ——
  function depEdges(list) {
    const raw = (DATA && DATA.deps && Array.isArray(DATA.deps.edges)) ? DATA.deps.edges : [];
    if (!raw.length) return [];
    const pos = new Map(list.map((s, i) => [s.id, i]));
    return raw.filter((e) => pos.has(e.from) && pos.has(e.to))
      .map((e) => ({ from: e.from, to: e.to, a: pos.get(e.from), b: pos.get(e.to) }))
      .filter((e) => e.a !== e.b && Math.abs(e.b - e.a) > 1);
  }
  function drawFlowDeps() {
    const svg = $('#canvas .flow-deps');
    if (!svg) return;
    const wrap = $('#canvas .flow-wrap');
    const nodes = [...wrap.querySelectorAll('.flow-node')];
    const edges = depEdges(stepsFor(state.filter));
    if (!nodes.length || !edges.length) return;
    // offsetTop/offsetHeight 取布局坐标（canvas 可能整体 scale，getBoundingClientRect 会失真）
    const ys = nodes.map((el) => ({ top: el.offsetTop, bot: el.offsetTop + el.offsetHeight, mid: el.offsetTop + el.offsetHeight / 2 }));
    const H = wrap.offsetHeight;
    svg.setAttribute('width', '40');
    svg.setAttribute('height', String(H));
    svg.setAttribute('viewBox', `0 0 40 ${H}`);
    // 车道分配：跨度大的占外道，减少弧间相交
    const laneOf = new Map();
    edges.slice().sort((p, q) => Math.abs(q.b - q.a) - Math.abs(p.b - p.a))
      .forEach((e, i) => laneOf.set(e.from + '>' + e.to, i));
    const X0 = 38; // 节点左缘（wrap padding-left 46 - 8）
    const parts = [];
    for (const e of edges) {
      const lane = laneOf.get(e.from + '>' + e.to) % 6;
      const x = 30 - lane * 4.2;
      const back = e.b < e.a;
      const y1 = back ? ys[e.a].top + 4 : ys[e.a].bot - 5;
      const y2 = back ? ys[e.b].bot - 5 : ys[e.b].top + 4;
      const k = e.from + '>' + e.to;
      parts.push(`<path class="dep${back ? ' back' : ''}" data-dep="${esc(k)}" d="M ${X0} ${y1} C ${x} ${y1}, ${x} ${y2}, ${X0} ${y2}"/>`);
      parts.push(`<path class="dep-head" data-dep="${esc(k)}" d="M ${X0 + 1} ${y2} l -6.5 -3.2 v 6.4 z" transform="rotate(${back ? 180 : 0} ${X0} ${y2})"/>`);
    }
    svg.innerHTML = parts.join('');
  }
  function flowDepHover(stepId, on) {
    const svg = $('#canvas .flow-deps');
    if (!svg) return;
    const wrap = $('#canvas .flow-wrap');
    for (const e of depEdges(stepsFor(state.filter))) {
      if (e.from !== stepId && e.to !== stepId) continue;
      const k = e.from + '>' + e.to;
      svg.querySelectorAll(`[data-dep="${cssEsc(k)}"]`).forEach((el) => el.classList.toggle('on', on));
      const other = e.from === stepId ? e.to : e.from;
      const el = wrap.querySelector(`.flow-node[data-step="${cssEsc(other)}"]`);
      if (el) el.classList.toggle('rel', on);
    }
  }

  function flowHtml() {
    const list = stepsFor(state.filter);
    if (!list.length) return '<div class="none">当前筛选无步骤</div>';
    const related = relatedSteps();
    const deps = depEdges(list);
    const gates = (DATA.gates && DATA.gates.length ? DATA.gates : ['构建 / 类型检查', '自动化测试', 'verify.mjs --scope']);
    const stepHtml = list.map((s, i) => {
      const files = filesForStep(s.id);
      const chips = files.slice(0, 4).map((f) => `<span title="${esc(f.path)}">${esc(f.path.split('/').pop())}</span>`).join('') +
        (files.length > 4 ? `<span>+${files.length - 4}</span>` : '');
      return `<div class="flow-node ${state.step === s.id || (related && related.has(s.id)) ? 'on' : ''} ${isAppendix(s) ? 'appendix' : ''}" data-step="${esc(s.id)}" style="--i:${i}" role="button" tabindex="0" aria-label="${esc(stepAria(s))}">` +
        `<div class="fn-head"><span class="fn-no">${stepNo(s)}</span><span class="fn-title">${esc(stepTitle(s))}</span><span style="margin-left:auto;font:9px var(--mono);color:var(--faint)">${files.length} 文件</span></div>` +
        (s.summary ? `<div class="fn-sum">${esc(s.summary)}</div>` : '') +
        (chips ? `<div class="fn-files">${chips}</div>` : '') +
        `</div>` + (i < list.length - 1 ? '<div class="flow-arrow"><i></i><b></b></div>' : '');
    }).join('');
    return `<div class="flow-wrap${deps.length ? ' has-deps' : ''}">` +
      (deps.length ? '<svg class="flow-deps" aria-hidden="true"></svg>' : '') +
      `<div class="flow-pill">◉ 计划确认 · ${esc(DATA.doc.type)} ${esc(DATA.doc.status || 'approved')}</div>` +
      `<div class="flow-arrow"><i></i><b></b></div>${stepHtml}` +
      `<div class="flow-arrow"><i></i><b></b></div>` +
      `<div class="flow-gate"><h4>验证门（全部通过才算完成）</h4><ul>${gates.map((g) => `<li>${esc(g)}</li>`).join('')}</ul>` +
      (() => { const le = latestEvidence(); return le ? `<div class="vfy-gate-ev${le.exitCode === 0 ? '' : ' bad'}">窗内最近凭证：<b>${le.exitCode === 0 ? '✓ ' + fmtTs(le.ts) + ' · ' + (le.gates ?? '?') + ' 门全过' : '✗ ' + fmtTs(le.ts) + ' · exit ' + le.exitCode}</b></div>` : ''; })() +
      `<div class="flow-fail">失败 → 回修当前步骤，不越过门禁</div></div>` +
      `<div class="flow-arrow"><i></i><b></b></div>` +
      `<div class="flow-pill end">✓ 关单 / 提交</div>` +
      `</div>`;
  }

  function dataflowHtml() {
    const objs = dfObjects();
    if (!objs.length) return '<div class="none">未识别到跨文件数据对象（需 diff 或文档正文含类型定义）</div>';
    const flows = (DATA.dataflow && Array.isArray(DATA.dataflow.flows)) ? DATA.dataflow.flows : [];
    const cross = objs.reduce((n, o) => n + Math.max(0, ((o.layers || []).length - 1)), 0);
    const kindOf = (name) => (objs.find((o) => o.name === name) || {}).kind || '';
    const objRow = (o, i) => {
      const layers = o.layers || [];
      const slots = layers.map((ly) => {
        const names = (o.files || []).filter((p) => (fileOf(p)?.layer) === ly).map((p) => p.split('/').pop());
        const show = names.slice(0, 2).join('、') + (names.length > 2 ? ` +${names.length - 2}` : '');
        return `<div class="df-slot"><span class="lyr">${esc(LAYER_LABEL[ly] || ly)}</span><span class="fs" title="${esc(names.join(' · '))}">${esc(show || '—')}</span></div>`;
      });
      const lane = slots.map((s, j) => (j ? '<span class="df-link"></span>' : '') + s).join('');
      return `<div class="df-obj ${state.dataflowObj === o.name ? 'on' : ''}" data-df="${esc(o.name)}" style="--i:${i}" role="button" tabindex="0" aria-label="数据对象 ${esc(o.name)}" title="点击联动相关步骤与文件（再次点击取消）">` +
        `<span class="df-name">${esc(o.name)}</span>` +
        `<span class="kbadge ${esc(o.kind || '')}">${esc(o.kind || '?')}</span>` +
        `<span class="df-nfiles">${(o.files || []).length} 文件</span>` +
        (lane ? `<span class="df-lane">${lane}</span>` : '') +
        `</div>`;
    };
    const stepLbl = (id) => {
      const s = stepOf(id);
      return s
        ? `<button class="df-step" data-step="${esc(id)}" title="联动步骤 ${esc(s.title)}"><b>${esc(id)}</b>${esc(s.title)}</button>`
        : `<span>${esc(id)}</span>`;
    };
    return `<div class="df-wrap">` +
      `<div class="df-sum">${objs.length} 个数据对象 · 跨层 ${cross} 处 · ${flows.length} 条步骤间传递</div>` +
      objs.map(objRow).join('') +
      (flows.length ? `<div class="df-sec">步骤间传递</div>` + flows.map((f) =>
        `<div class="df-flow">${stepLbl(f.from)}<span class="arr">→</span>` +
        `<span class="kbadge ${esc(kindOf(f.object))}" title="数据对象 ${esc(f.object)}">${esc(f.object)}</span>` +
        `<span class="arr">→</span>${stepLbl(f.to)}</div>`).join('') : '') +
      `</div>`;
  }

  // 右侧总览：只放“结论/缺口/门禁”，步骤全文在选中后下钻；不再复述中间 9 张卡片。
  function overviewHtml() {
    const s = DATA.stats || {};
    const realSteps = DATA.steps.filter((x) => !isAppendix(x)).length;
    const app = DATA.steps.find(isAppendix);
    const appFiles = app ? filesForStep(app.id) : [];
    const issues = (DATA.parseHealth && DATA.parseHealth.issues) || [];
    const issueKinds = new Set(issues.map((it) => it.kind)).size;
    const ph = DATA.parseHealth || {};
    const lowHit = !!(ph.layersFallback || (ph.total && ph.hitRate < 0.5));
    const ev = latestEvidence();
    const evOk = ev && ev.exitCode === 0;
    const evText = ev
      ? (evOk
        ? `最近绿行 ${fmtTs(ev.ts)} · ${ev.gates ?? '?'} 门全过`
        : `最近 exit=${ev.exitCode}（${fmtTs(ev.ts)} · ${ev.suite || '?'}）未达全绿`)
      : '时间窗内无验证凭证';
    const skipped = ev && (ev.skipped || []).length;
    const gateList = (DATA.gates && DATA.gates.length ? DATA.gates : ['构建 / 类型检查', '自动化测试', 'verify.mjs --scope']);
    const gateText = gateList.map((g) => String(g).replace(/`/g, '').split(/[：:（(]/)[0].trim()).join(' · ');
    const gateFull = gateList.map((g) => String(g).replace(/`/g, '')).join(' | ');
    const risks = {};
    for (const st of DATA.steps) {
      for (const d of (st.detail || [])) {
        const m = String(d).match(/^-\s*风险[：:]\s*(高|中|低)/);
        if (m) risks[m[1]] = (risks[m[1]] || 0) + 1;
      }
    }
    const riskText = ['高', '中', '低'].filter((k) => risks[k]).map((k) => `${k} ${risks[k]}`).join(' · ') || '未登记';
    const hotSteps = DATA.steps.filter((st) => (st.detail || []).some((d) => /^-\s*风险[：:]\s*(高|中)/.test(String(d)))).map((st) => st.id);
    const unresolved = (DATA.deps && DATA.deps.unresolved) || 0;
    const ups = DATA.doc.upstream || [];
    const reqSource = ups.length
      ? ups.map((u) => `<div class="ov-sub"><b>${esc(u.type)}</b> ${esc(u.title)}${u.purpose ? `<br><span class="ov-req-purpose" title="${esc(u.purpose)}">${mdInline(u.purpose)}</span>` : ''}</div>`).join('')
      : (DATA.doc.purpose
        ? `<div class="ov-sub">${mdInline(DATA.doc.purpose)}</div>`
        : '<div class="ov-sub">未登记上游需求；在 plan 写「对应入口 / 对应 spec」后自动出现。</div>');
    return `<div class="ov">` +
      `<section class="ov-sec">` +
        `<div class="ov-eyebrow">需求来源</div>` +
        reqSource +
        (hasReqs() ? `<button class="ov-link" type="button" data-view="reqs">查看需求与验收 →</button>` : '') +
      `</section>` +
      `<section class="ov-sec">` +
        `<div class="ov-eyebrow">范围</div>` +
        `<div class="ov-kpis"><b>${realSteps}</b> 步 · <b>${s.files || 0}</b> 代码${s.docs ? ` · <b>${s.docs}</b> 文档` : ''}</div>` +
        `<div class="ov-sub">修改 ${s.modified || 0} · 计划中 ${s.planned || 0} · <span class="ov-add">+${fmt(s.additions || 0)}</span> / <span class="ov-del">−${fmt(s.deletions || 0)}</span></div>` +
      `</section>` +
      `<section class="ov-sec">` +
        `<div class="ov-eyebrow">未归属文件${app ? ` <b>${appFiles.length}</b>` : ''}</div>` +
        (app
          ? `<button class="ov-link" type="button" data-step="${esc(app.id)}">附：改动清单（${appFiles.length} 个文件）→</button>` +
            `<div class="ov-sub">任务拆解未覆盖；补 <code>- 文件：</code> 后会自动归位。</div>`
          : `<div class="ov-sub">无未归属文件。</div>`) +
      `</section>` +
      `<section class="ov-sec">` +
        `<div class="ov-eyebrow">验证 / 门禁</div>` +
        `<div class="ov-status ${ev ? (evOk ? 'ok' : 'bad') : ''}"><i></i><span>${esc(evText)}</span></div>` +
        (skipped ? `<div class="ov-sub">本地跳过 ${skipped} 项（缺环境），未计入失败。</div>` : '') +
        `<div class="ov-sub" title="${esc(gateFull)}">计划门禁 ${gateList.length} 项：${esc(gateText)}</div>` +
        (hasEvidence() ? `<button class="ov-link" type="button" data-view="verify">查看验证 →</button>` : "") +
      `</section>` +
      `<section class="ov-sec">` +
        `<div class="ov-eyebrow">解析与风险</div>` +
        `<div class="ov-sub">${issues.length ? `解析告警 ${issues.length} 项 / ${issueKinds} 类` : '解析正常'}${lowHit ? ` · 直认 ${ph.direct ?? '?'}/${ph.total ?? '?'}` : ''} · 依赖未解析 ${unresolved} 处</div>` +
        `<div class="ov-sub">风险：${riskText}${hotSteps.length ? `（关注 ${hotSteps.join('/')}）` : ''}</div>` +
      `</section>` +
      `</div>`;
  }

  // 选中步骤的「需求来源」：只放 INTENT/SPEC 的一句话，详细要点去需求 tab。

  function renderDetail() {
    const curStep = state.step ? stepOf(state.step) : null;
    const detailKey = curStep ? curStep.id : '__overview__';
    const resetScroll = detailKey !== lastDetailKey;
    lastDetailKey = detailKey;
    const back = $('#detail-back');
    if (back) back.hidden = !curStep;
    const heading = $('.detail-head h2');
    if (heading) heading.textContent = curStep ? '变更说明' : '总览';
    const filterTabs = $('#filter-tabs');
    if (!curStep) {
      if (filterTabs) { filterTabs.style.display = 'none'; filterTabs.innerHTML = ''; }
      $('#detail-sub').textContent = '范围 · 验证 · 未归属';
      $('#detail-body').innerHTML = overviewHtml();
      if (resetScroll) $('#detail-body').scrollTop = 0;
      return;
    }
    if (filterTabs) filterTabs.style.display = '';

    // 计数与筛选共用 matchesFilter，修掉 planned 状态与 planned 标记重复计数（12 → 6）。
    const counts = {};
    for (const [k] of FILTERS) counts[k] = DATA.files.filter((f) => matchesFilter(f, k)).length;
    filterTabs.innerHTML = FILTERS.map(([k, label]) =>
      `<button data-filter="${k}" title="${k === 'planned' ? '计划中：文档已登记、工作树尚未实际改动（含文档/工具）' : '文件筛选（含文档/工具）'}" class="${state.filter === k ? 'on' : ''}">${label}<span class="n">${counts[k]}</span></button>`).join('');
    $('#detail-sub').textContent = isAppendix(curStep) ? '附录 · 未分步文件' : `第 ${curStep.index} 步`;
    const list = [curStep];

    const dfo = dataflowObj();
    const related = relatedSteps();
    const html = list.map((s, i) => {
      let files = filesForStep(s.id);
      const totalFiles = files.length;
      if (state.filter !== 'all') files = files.filter((f) => matchesFilter(f, state.filter));
      const rawDetails = (s.detail || []).map((d) => d.replace(/^[-*]\s*/, '').trim()).filter(Boolean);
      const acceptance = (s.source === 'tasks' && s.summary) ? [s.summary] : rawDetails
        .filter((d) => /^判据[：:]/.test(d))
        .map((d) => d.replace(/^判据[：:]\s*/, ''))
        .filter(Boolean);
      const proof = rawDetails
        .filter((d) => /^留痕[：:]/.test(d))
        .map((d) => d.replace(/^留痕[：:]\s*/, ''))
        .filter(Boolean);
      const details = rawDetails
        .filter((d) => !/^(判据|留痕)[：:]/.test(d) && !/^(留痕|风险|依赖|判据)[：:]?$/.test(d))
        .slice(0, 8);
      const ev = latestEvidence();
      const evOk = ev && ev.exitCode === 0;
      const evText = ev
        ? (evOk
          ? `最近绿行 ${fmtTs(ev.ts)} · ${ev.gates ?? '?'} 门全过`
          : `最近 exit=${ev.exitCode}（${fmtTs(ev.ts)} · ${ev.suite || '?'}）未达全绿`)
        : '时间窗内无验证凭证';
      const verifyLine = `<div class="sc-proof-verify"><b>计划级验证</b><span class="${evOk ? 'ok' : ev ? 'bad' : ''}">${esc(evText)}</span>${hasEvidence() ? '<button class="ov-link" type="button" data-view="verify">查看验证 →</button>' : ''}</div>`;
      const proofHtml = isAppendix(s) ? '' :
        `<div class="sc-proof${acceptance.length || proof.length || ev ? '' : ' empty'}">` +
          `<div class="sc-proof-h">怎么证明 · 验收判据</div>` +
          (acceptance.length
            ? `<ul class="sc-accept">${acceptance.map((a) => `<li>${mdInline(a)}</li>`).join('')}</ul>`
            : `<div class="sc-proof-empty">未登记验收判据</div>`) +
          (proof.length ? `<div class="sc-proof-meta"><b>留痕</b>${proof.map((p) => mdInline(p)).join('；')}</div>` : '') +
          verifyLine +
        `</div>`;
      const emptyText = isVerificationStep(s) ? '验证步骤（无代码文件）' : (totalFiles ? '当前筛选无文件' : '该步未列文件');
      const statusTag = s.status === 'done' ? '<span class="done">已完成</span>' : s.status === 'warn' ? '<span class="done" style="color:var(--warn)">待复核</span>' : '';
      const eyebrow = isAppendix(s) ? '附录 · 改动清单' : `做什么 · ${sourceLabel(s)}${statusTag}`;
      return `<div class="step-card ${state.step === s.id || (related && related.has(s.id)) ? 'on' : ''} ${s.status === 'warn' ? 'warn' : ''} ${isAppendix(s) ? 'appendix' : ''}" data-step="${esc(s.id)}" style="--i:${i}">` +
        `<div class="sc-head" data-step="${esc(s.id)}" role="button" tabindex="0" aria-label="${esc(stepAria(s))}"><span class="sc-no">${stepNo(s)}</span><div class="sc-titlewrap"><div class="sc-eyebrow">${eyebrow}</div><h3>${esc(stepTitle(s))}</h3></div><span class="meta">${files.length} 文件</span></div>` +
        `<div class="sc-body">` +
        (s.summary && !(s.source === 'tasks') ? `<p class="sc-summary">${esc(s.summary)}</p>` : '') +
        (!isAppendix(s) ? stepReqHtml() : '') +
        (!isAppendix(s) ? `<div class="sc-sec"><div class="sc-sec-h">怎么做 · 实现要点 / 依赖 / 风险</div>${details.length ? `<ul class="sc-detail">${details.map((d) => `<li>${mdInline(d)}</li>`).join('')}</ul>` : '<div class="sc-sec-empty">任务拆解未写实现要点 / 依赖 / 风险</div>'}</div>` : '') +
        `<div class="sc-sec"><div class="sc-sec-h">改动文件 <b>${files.length}</b></div>` +
        `<div class="sc-files">${files.map((f) => fileRow(f, dfo)).join('') || `<div class="none" style="padding:8px">${emptyText}</div>`}</div></div>` +
        (proofHtml ? `<div class="sc-sec">${proofHtml}</div>` : '') +
        `</div></div>`;
    }).join('');
    $('#detail-body').innerHTML = html || '<div class="none">无步骤</div>';
    if (resetScroll) $('#detail-body').scrollTop = 0;
  }

  function fileRow(f, dfo) {
    const diffBtn = f.diff ? `<button class="diff-btn" data-diff="${esc(f.path)}">diff</button>` : '';
    const nums = (f.additions || f.deletions) ? `<span class="num">+${f.additions || 0}${f.deletions ? `<del>-${f.deletions}</del>` : ''}</span>` : '';
    const active = state.file === f.path || (dfo && (dfo.files || []).includes(f.path)) ? 'on' : '';
    return `<div class="file-row ${active}" data-file="${esc(f.path)}" title="${esc(f.path)}" role="button" tabindex="0" aria-label="文件 ${esc(f.path)}">` +
      `<span class="dot" style="background:${statusDot(f)}"></span>` +
      `<span class="path">${esc(f.path)}</span>${nums}${badgeOf(f)}${diffBtn}</div>` +
      (f.diff ? `<pre class="diff ${state.file === f.path ? 'open' : ''}" data-diff-for="${esc(f.path)}">${diffHtml(f.diff)}</pre>` : '');
  }

  function diffHtml(diff) {
    const lines = String(diff).split(/\r?\n/);
    return lines.map((l) => {
      let cls = '';
      if (/^diff --git|^index |^--- |^\+\+\+ |^new file|^deleted file|^similarity|^rename /.test(l)) cls = 'meta';
      else if (/^@@/.test(l)) cls = 'hunk';
      else if (/^\+/.test(l)) cls = 'add';
      else if (/^-/.test(l)) cls = 'del';
      return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
    }).join('\n');
  }

  function renderAll(opts = {}) {
    if (!DATA) return;
    const scroll = {
      tree: $('#file-tree').scrollTop,
      detail: $('#detail-body').scrollTop,
      nav: $('#step-nav').scrollTop,
      canvas: $('#canvas-scroll').scrollLeft,
    };
    const detailKeyBefore = lastDetailKey;
    renderHeader();
    renderStepNav();
    renderTree();
    renderCanvas();
    renderDetail();
    $('#file-tree').scrollTop = scroll.tree;
    $('#detail-body').scrollTop = lastDetailKey === detailKeyBefore ? scroll.detail : 0;
    $('#step-nav').scrollTop = scroll.nav;
    if (opts.keepCanvas) $('#canvas-scroll').scrollLeft = scroll.canvas;
    else $('#canvas-scroll').scrollLeft = 0;
    if (opts.scrollFile) {
      const el = $(`.file-row[data-file="${cssEsc(state.file)}"]`);
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    if (opts.scrollStep) {
      const el = $(`.station[data-step="${cssEsc(state.step)}"], .flow-node[data-step="${cssEsc(state.step)}"]`);
      if (el) el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
    }
    syncHash();
  }
  function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

  function selectStep(id) {
    state.step = state.step === id ? null : id;
    state.file = null;
    renderAll({ scrollStep: true });
  }
  function selectFile(p) {
    const f = fileOf(p);
    if (!f) return;
    state.file = p;
    state.step = (f.steps && f.steps[0]) || state.step;
    renderAll({ scrollFile: true });
  }
  function toggleDataflowObj(name) {
    if (state.dataflowObj === name) {
      clearDataflowSel(true);
    } else {
      if (!state.dataflowObj) { state.dfPrevStep = state.step; state.dfPrevFile = state.file; }
      state.dataflowObj = name;
    }
    renderAll();
  }
  function clearLink() {
    state.step = null; state.file = null;
    clearDataflowSel(false);
    state.filter = 'all';
    stopFollow();
    renderAll();
  }
  function setView(v) {
    if (v === 'dataflow' && !hasDataflow()) v = 'panorama';
    if (v === 'reqs' && !hasReqs()) v = 'panorama';
    if (v === 'verify' && !hasEvidence()) v = 'panorama';
    state.view = v;
    state.zoom = 1;
    $$('#view-tabs .tab').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
    renderAll();
    // 视图用量埋点（2026-11-11 tour-usage）：fire-and-forget，失败静默不影响页面；
    // 静态 file:// 快照无服务时自然跳过。数据只落本机 .agents/cache/tour-usage.jsonl（口径见 dev-tour SKILL 边界节）。
    if (DATA && DATA.doc && DATA.doc.path && typeof fetch === 'function') {
      try {
        fetch('/api/tour/usage', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ doc: DATA.doc.path, view: v, ts: new Date().toISOString() }) }).catch(() => {});
      } catch { /* file:// 下同步抛错也不影响页面 */ }
    }
  }
  function setFilter(f) { state.filter = f; renderAll(); }

  function fitZoom() {
    if (state.view === 'panorama' && state.layout === 'grid') { state.zoom = 1; renderCanvas(); return; }
    const wrap = $('#canvas');
    const scroller = $('#canvas-scroll');
    const contentW = wrap.scrollWidth;
    const avail = scroller.clientWidth - 36;
    const z = contentW > avail ? Math.max(0.25, avail / contentW) : 1;
    state.zoom = Math.round(z * 100) / 100;
    renderCanvas();
  }
  function zoomBy(d) {
    state.zoom = Math.max(0.25, Math.min(1.6, Math.round((state.zoom + d) * 10) / 10));
    renderCanvas();
  }

  function startFollow() {
    state.follow = true;
    $('#btn-follow').classList.add('on');
    $('#btn-follow').textContent = '❚❚ 暂停跟走';
    const order = DATA.steps.map((s) => s.id);
    const cur = state.step ? order.indexOf(state.step) : -1;
    let i = cur < 0 ? 0 : cur;
    state.step = order[i];
    renderAll({ scrollStep: true });
    followTimer = setInterval(() => {
      i++;
      if (i >= order.length) { stopFollow(); return; }
      state.step = order[i];
      state.file = null;
      renderAll({ scrollStep: true });
    }, 4200);
  }
  function stopFollow() {
    state.follow = false;
    clearInterval(followTimer); followTimer = null;
    $('#btn-follow').classList.remove('on');
    $('#btn-follow').textContent = '▶ 跟着流程走';
  }
  function toggleFollow() { state.follow ? stopFollow() : startFollow(); }

  function bind() {
    document.addEventListener('click', (e) => {
      const dir = e.target.closest('.tree-row');
      if (dir) {
        const box = dir.closest('.tree-dir');
        const p = box.dataset.dir;
        if (state.collapsed.has(p)) state.collapsed.delete(p); else state.collapsed.add(p);
        renderTree();
        return;
      }
      const cp = e.target.closest('[data-copy]');
      if (cp) {
        e.stopPropagation();
        const text = cp.dataset.copy || '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          const old = cp.textContent;
          navigator.clipboard.writeText(text).then(() => { cp.textContent = '已复制'; setTimeout(() => { cp.textContent = old; }, 1200); }).catch(() => {});
        }
        return;
      }
      const df = e.target.closest('[data-diff]');
      if (df) {
        e.stopPropagation();
        const pre = $(`[data-diff-for="${cssEsc(df.dataset.diff)}"]`);
        if (pre) pre.classList.toggle('open');
        return;
      }
      const dfc = e.target.closest('[data-df]');
      if (dfc) { e.stopPropagation(); toggleDataflowObj(dfc.dataset.df); return; }
      const file = e.target.closest('[data-file]');
      if (file) { e.stopPropagation(); selectFile(file.dataset.file); return; }
      const step = e.target.closest('[data-step]');
      if (step) { selectStep(step.dataset.step); return; }
      const view = e.target.closest('[data-view]');
      if (view) { setView(view.dataset.view); return; }
      const filter = e.target.closest('[data-filter]');
      if (filter) { setFilter(filter.dataset.filter); return; }
    });
    document.addEventListener('mouseover', (e) => {
      const n = e.target.closest('.flow-node');
      if (n && n.dataset.step) flowDepHover(n.dataset.step, true);
    });
    document.addEventListener('mouseout', (e) => {
      const n = e.target.closest('.flow-node');
      if (n && n.dataset.step) flowDepHover(n.dataset.step, false);
    });
    window.addEventListener('resize', () => { if (state.view === 'flow') drawFlowDeps(); });
    $('#search').addEventListener('input', (e) => { state.query = e.target.value; renderStepNav(); renderTree(); });
    $('#btn-clear').addEventListener('click', clearLink);
    $('#detail-back').addEventListener('click', clearLink);
    $('#btn-follow').addEventListener('click', toggleFollow);
    $('#btn-copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(DATA.doc.path); $('#btn-copy').textContent = '已复制'; setTimeout(() => $('#btn-copy').textContent = '复制路径', 1200); } catch { /* 忽略 */ }
    });
    $('#expand-all').addEventListener('click', () => { state.collapsed.clear(); renderTree(); });
    $('#collapse-all').addEventListener('click', () => {
      state.collapsed.clear();
      const walk = (node) => { for (const d of node.dirs.values()) { state.collapsed.add(d.path); walk(d); } };
      walk(buildTree(DATA.files));
      renderTree();
    });
    $('#btn-focus').addEventListener('click', () => {
      document.body.classList.toggle('focus');
      renderAll();
    });
    $('#layout-toggle').addEventListener('click', () => {
      state.layout = state.layout === 'grid' ? 'timeline' : 'grid';
      try { localStorage.setItem('devTourLayout', state.layout); } catch { /* 本地禁用时忽略 */ }
      state.zoom = 1;
      renderAll();
    });
    $('#fit').addEventListener('click', fitZoom);
    $('#zoom-in').addEventListener('click', () => zoomBy(0.1));
    $('#zoom-out').addEventListener('click', () => zoomBy(-0.1));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { document.body.classList.remove('focus'); clearLink(); return; }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if ((e.key === 'Enter' || e.key === ' ') && e.target.tagName !== 'BUTTON') {
        const hit = e.target.closest('[data-step],[data-file],[data-diff],[data-df]');
        if (hit) { e.preventDefault(); hit.click(); return; }
      }
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        const order = DATA.steps.map((s) => s.id);
        const i = state.step ? order.indexOf(state.step) : -1;
        const next = e.key === 'ArrowRight' ? Math.min(order.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
        state.step = order[next]; state.file = null;
        renderAll({ scrollStep: true });
      }
    });
    window.addEventListener('hashchange', () => {
      const p = new URLSearchParams(location.hash.slice(1));
      state.step = p.get('step') || null;
      state.file = p.get('file') || null;
      if (p.get('view')) setView(p.get('view')); else renderAll();
    });
  }

  async function fetchModel() {
    const file = DOC_FILE || new URLSearchParams(location.search).get('file');
    if (!file) throw new Error('缺少 file 参数');
    const r = await fetch('/api/tour?file=' + encodeURIComponent(file), { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    if (j.doc && !j.doc.path) j.doc.path = file;
    return j;
  }

  function applyModel(model) {
    const dfo = (model.dataflow && Array.isArray(model.dataflow.objects)) ? model.dataflow.objects : [];
    const dfl = (model.dataflow && Array.isArray(model.dataflow.flows)) ? model.dataflow.flows : [];
    const dpe = (model.deps && Array.isArray(model.deps.edges)) ? model.deps.edges : [];
    const sig = model.files.length + '|' + model.stats.additions + '/' + model.stats.deletions + '|' + model.steps.map((s) => s.id + s.files.length).join(',') + '|' + model.files.map((f) => f.path + f.status + f.additions + f.deletions + (f.diff ? f.diff.length : 0)).join(',') +
      '|df:' + dfo.length + ':' + dfo.map((o) => o.name + ':' + (o.kind || '') + ':' + (o.files || []).length + ':' + (o.steps || []).join('+')).join(';') + '|' + dfl.map((f) => f.object + '>' + f.from + '>' + f.to).join(';') +
      '|deps:' + dpe.map((e) => e.from + '>' + e.to).join(';') +
      '|reqs:' + ((model.doc.upstream || []).map((u) => u.path + u.purpose + (u.points || []).length).join(';')) +
      '|ev:' + ((model.evidence && model.evidence.rows || []).map((r) => r.ts + r.exitCode + ':' + (r.note || '').length + ':' + (r.logTail || '').length + ':' + Object.keys(r.durations || {}).length).join(';')) +
      '|ph:' + JSON.stringify(model.parseHealth || null);
    if (sig === lastSig) return false;
    lastSig = sig;
    DATA = model;
    FILE_BY_PATH = new Map(DATA.files.map((f) => [f.path, f]));
    if (state.step && !DATA.steps.some((s) => s.id === state.step)) state.step = null;
    if (state.file && !FILE_BY_PATH.has(state.file)) state.file = null;
    if (state.dataflowObj && !dfo.some((o) => o.name === state.dataflowObj)) clearDataflowSel(true);
    return true;
  }

  async function refresh() {
    if (MODE !== 'live' || document.visibilityState === 'hidden') return;
    if (Date.now() - lastRefresh < 1200) return;
    lastRefresh = Date.now();
    try {
      const m = await fetchModel();
      if (applyModel(m)) renderAll({ keepCanvas: true });
      $('#live').querySelector('span').textContent = '实时';
    } catch (e) {
      $('#live').classList.add('off');
      $('#live').querySelector('span').textContent = '断线';
    }
  }

  async function init() {
    try {
      if (EMBEDDED) applyModel(EMBEDDED);
      else applyModel(await fetchModel());
    } catch (e) {
      $('#title').textContent = '开发全景图加载失败';
      $('#subtitle').textContent = e.message;
      $('#canvas').innerHTML = `<div class="none">${esc(e.message)}<br><br>实时视图需先启动 <code>node .agents/scripts/ensure-board.mjs</code></div>`;
      return;
    }
    readHash();
    if (!['panorama', 'sequence', 'flow', 'dataflow', 'reqs', 'verify'].includes(state.view)) state.view = 'panorama';
    if (state.view === 'dataflow' && !hasDataflow()) state.view = 'panorama';
    if (state.view === 'reqs' && !hasReqs()) state.view = 'panorama';
    if (state.view === 'verify' && !hasEvidence()) state.view = 'panorama';
    $$('#view-tabs .tab').forEach((b) => b.classList.toggle('on', b.dataset.view === state.view));
    bind();
    renderAll();
    setTimeout(() => document.getElementById('app').classList.remove('booting'), 1700);
    if (state.file) {
      const el = $(`.file-row[data-file="${cssEsc(state.file)}"]`);
      if (el) el.scrollIntoView({ block: 'center' });
    }
    if (MODE === 'live') {
      try {
        sse = new EventSource('/api/events');
        sse.addEventListener('changed', () => setTimeout(refresh, 400));
        sse.addEventListener('watchdead', () => {
          $('#live').classList.add('off');
          $('#live').querySelector('span').textContent = '轮询';
        });
        sse.onerror = () => { $('#live').classList.add('off'); $('#live').querySelector('span').textContent = '轮询'; };
      } catch { /* 无 SSE 时靠轮询 */ }
      liveTimer = setInterval(refresh, 5000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
    }
  }

  init();
})();
</script>
</body>
</html>
