# 全仓库测试门禁：
#   1. 版本位一致性（scripts/release.mjs --check：5 插件 × 各 7-8 处版本位）
#   2. 垫片一致性 + skill 名唯一性 + CI 引用「已入库」对账（scripts/manifest-lint.mjs，含其反证自测）
#   3. 五个插件的全部 node 测试套件（零依赖，Node ≥ 18 即可跑；逐条在下方各插件步骤里列明）
# pstack extras 的 bun 测试套件不进 CI：仅上游 POSIX 验证，Windows 下有平台性失败
#（见 plugins/pstack/extras/README.md），待其适配后再纳入。
# windows 用 bash shell：sheet-parity 依赖 awk（Git Bash 自带），node 命令本身无 shell 依赖。
name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 18 是**声明的下限**（三份 mcp/server.mjs 的运行期自检都写 `Node.js 18 or newer is required`，
        # 各插件 README 同口径），此前矩阵只跑 20/22 → 下限从未被验证过，声明可以随便烂掉。
        # 静态扫描（2026-10-28）未见 >18 API（无 Object.groupBy / toSorted / crypto.hash / fs.globSync /
        # structuredClone / URL.parse / Atomics.waitAsync / RegExp v 标志）。若本项转红，说明实际下限
        # 高于声明——按仓库纪律应改 README 与自检值，而不是把这一档从矩阵删掉。
        node: [18, 20, 22]
    steps:
      # action pin 到 commit SHA（2026-10-29）：tag 可变，被投毒的 action 换 tag 指向即可拿走
      # runner 上的 GITHUB_TOKEN 与代码。SHA pin + Dependabot（dependabot.yml 负责提版本更新 PR）
      # 是官方推荐组合——升级走显式 PR，而不是让 tag 漂移。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # worktree-ops 的冒烟测试会真实创建 git 提交，runner 需要可用身份
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Version consistency (release.mjs --check)
        run: node scripts/release.mjs --check
      - name: Manifest / shim consistency (manifest-lint.mjs)
        run: node scripts/manifest-lint.mjs
      # 守护自身的反证测试：manifest-lint 的「CI 引用文件必须已入库」若在某个改动下静默失效
      #（解析口径与 ci.yml 写法脱节是真实风险），本步会在临时 git 仓里造出违规并断言被拦下。
      - name: manifest-lint tracking guard (selftest)
        run: node scripts/manifest-lint.selftest.mjs
      - name: systemone-decision tests
        run: |
          node plugins/systemone-decision/test/smoke.mjs
          node plugins/systemone-decision/test/hook.smoke.mjs
          node plugins/systemone-decision/test/contract.smoke.mjs
      - name: worktree-ops tests
        run: |
          node plugins/worktree-ops/test/smoke.mjs
          node plugins/worktree-ops/test/lock.mjs
          node plugins/worktree-ops/test/bucket.mjs
          node plugins/worktree-ops/test/exclude.mjs
          node plugins/worktree-ops/test/paths.mjs
          node plugins/worktree-ops/test/inside.mjs
          node plugins/worktree-ops/test/merge-main.mjs
          node plugins/worktree-ops/test/timeout.mjs
      - name: agent-pipelines tests
        run: |
          node plugins/agent-pipelines/test/contract.mjs
          node plugins/agent-pipelines/test/pipeline.mjs
          node plugins/agent-pipelines/test/equivalence.mjs
          node plugins/agent-pipelines/test/regression.mjs
      - name: pstack tests
        run: |
          cd plugins/pstack
          node test/run-hook-tests.mjs
          node test/sheet-parity.mjs
          node test/role-table-parity.mjs
          # check-plan.mjs 是已发布的随装随用脚本，此前唯一测试在 extras/ 的 bun 套件里
          # （CI 明写不纳入、Windows 有平台性失败）= 任何平台零守护。本条是 node:test 重写版。
          node test/check-plan.test.mjs
      - name: ai-native-delivery tests
        run: |
          cd plugins/ai-native-delivery
          node test/smoke.mjs
          node test/check-loop.test.mjs
          node test/check-loop-rev.test.mjs
          node test/check-loop-rev-hook.test.mjs
          node test/check-loop-rev-ledger.test.mjs
          node test/check-loop-rev-outside.test.mjs
          node test/check-loop-rev-tree.test.mjs
          node test/warn-format.test.mjs
          node test/warn-fold-plugin.test.mjs
          node test/judgment-ledger.test.mjs
          node test/fill-intent.test.mjs
          node test/fill-spec.test.mjs
          node test/fill-plan.test.mjs
          node test/closeout-l1.test.mjs
          node test/git-merge-jsonl.test.mjs
          node test/compact-ledgers.test.mjs
          node test/archive-sweep.test.mjs
          node test/check-ledger-doc-presence.test.mjs
          node test/check-ledger-invariant.test.mjs
          node test/agg-delegations.test.mjs
          node test/failure-attribution.test.mjs
          node test/check-pr-size.test.mjs
          node test/check-secrets.test.mjs
          node test/check-scope.test.mjs
          node test/check-query-contract.test.mjs
          node test/gen-effective-policy.test.mjs
          node test/check-lane-surface.test.mjs
          node test/agg-judgments.test.mjs
          node test/check-regression-consistency.test.mjs
          node test/check-script-coverage.test.mjs
          node test/confirm-doc.test.mjs
          node test/delegation-presence.test.mjs
          node test/gen-workflow-index.test.mjs
          node test/git-core.test.mjs
          node test/ledger-loader.test.mjs
          node test/ledger-shards.test.mjs
          node test/mechanism-retire-watch.test.mjs
          node test/metrics-core.test.mjs
          node test/pipeline-run.test.mjs
          node test/policy.test.mjs
          node test/rule-budget.test.mjs
          node test/workflow-enums.test.mjs
          node test/verify.test.mjs
          node test/verify-scope.test.mjs
          node test/verify-engine-gates.test.mjs
          node test/kb-search.test.mjs
          node test/rewrite-file.test.mjs
          node test/append-compensation.test.mjs
          node test/gen-verify-evidence.test.mjs
          node test/contract-commands.mjs
          node test/check-scripts-syntax.test.mjs
          node test/workflows-check.test.mjs
          node test/check-local-gates.test.mjs
          node test/check-local-gate-config.test.mjs
          node test/gen-engine-map.test.mjs
          node test/gen-workflow-metrics.test.mjs
          node test/grade.test.mjs
          node test/hook.test.mjs
          node test/init.test.mjs
          node test/mcp-tools.test.mjs
          node skills/session-resume/scripts/worktree-audit.test.mjs
          node skills/verify-ui/scripts/gen-verify-feature.test.mjs
          node skills/decision-log/scripts/decision-log.test.mjs
